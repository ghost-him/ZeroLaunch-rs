name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check frontend
        run: bunx vue-tsc --noEmit

      - name: Build frontend
        run: bunx vite build

      - name: Copy i18n locales to src-tauri
        uses: ./.github/actions/copy-i18n

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          bun x commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Host API exposure audit
        # 审计 PluginHandle 的每个能力是否都能被第三方插件调用（协议方法 + 分发分支 + SDK 代理），
        # 或已在 src-tauri/tests/host_api_exposure.rs 的清单里显式声明原因。
        # 单独成步是为了让失败点在 PR 检查列表里一目了然（也已包含在下一行的全量测试里）。
        run: cargo test -p zerolaunch-rs --test host_api_exposure

      - name: Run tests
        run: cargo test --all-features

      - name: Build installer (main branch only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cd xtask
          cargo run --bin xtask build-installer --arch x64

      - name: Upload artifacts (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            *.exe
            *.msi
          retention-days: 7
