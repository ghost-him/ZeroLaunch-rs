name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Sync wiki snapshot
        # 使用手册快照按 .gitignore 不入库；构建期由 build.rs 内嵌，缺快照会直接编译失败。
        shell: pwsh
        run: |
          cd xtask
          cargo run --bin xtask sync-wiki

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          npx --yes @commitlint/cli --from origin/${{ github.base_ref }} --to HEAD --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Host API exposure audit
        # 审计 PluginHandle 的每个能力是否都能被第三方插件调用（协议方法 + 分发分支 + SDK 代理），
        # 或已在 crates/zerolaunch-rs/tests/host_api_exposure.rs 的清单里显式声明原因。
        run: cargo test -p zerolaunch-rs --test host_api_exposure

      - name: Run tests
        run: cargo test --all-features

      - name: Install Inno Setup
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (main branch only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          cd xtask
          cargo run --bin xtask build-installer --arch x64

      - name: Upload artifacts (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            *.exe
            *.zip
          retention-days: 7
