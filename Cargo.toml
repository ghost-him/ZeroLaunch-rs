[workspace]
resolver = "2"
members = [
    "crates/platform-windows",
    "crates/plugin-api",
    "crates/plugin-protocol",
    "crates/plugin-host",
    "crates/plugin-sdk-rust",
    "zerolaunch-cli",
    "src-tauri",
]
exclude = ["xtask", "plugin-template"]

[workspace.package]
version = "1.5.8"
edition = "2021"
authors = ["ghost-him"]
license = "GPL-3.0-only"
repository = "https://github.com/ghost-him/ZeroLaunch-rs"

[workspace.dependencies]
# Common
async-trait = "0.1.92"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
parking_lot = "0.13.0"
dashmap = { version = "6.2.1", features = ["serde"] }
once_cell = "1.21.4"
chrono = "0.4.45"
notify-rust = "4.19.0"
url = "2.5.8"
time = "0.3.55"
walkdir = "2.5.0"
zip = "9.8.1"
regex = "1.13.2"
rusqlite = { version = "0.43", features = ["bundled"] }
ini = "2.0.0"
fontdb = "0.24"
image = "0.25.10"
resvg = "0.50.0"
usvg = "0.50.0"
tiny-skia = "0.12.0"
encoding_rs = "0.8.44"
async-openai = { version = "0.43", default-features = false, features = [
    "chat-completion",
    "embedding",
    "model",
    "rustls",
] }
futures-util = "0.3.34"
ollama-rs = { version = "0.3.6", features = ["stream"] }
reqwest = { version = "0.13.5", features = ["json"] }
blake3 = "1.8.7"
fnv = "1.0.7"
lru = "0.19.0"
sha2 = "0.11.1"
uuid = { version = "1.29.3", features = ["v4"] }
bincode-next = "3.2.0"
kmeans_colors = "0.7.1"
palette = "0.7.7"
rand = "0.10.4"
rayon = "1.12.0"
toml = "1.2"
semver = "1.0.28"
futures = "0.3.34"
mockall = "0.15"
sys-locale = "0.3.2"
# Windows
windows = "0.62.2"
# windows-core 必须与 windows 同版本，否则 PCWSTR/BOOL 等 ABI 类型会分裂成两套
windows-core = "0.62.2"
winreg = "0.56.0"
widestring = "1.2.1"
uiautomation = "0.25.2"
arboard = "3.7.0"
whoami = "2.1.3"
lnk = "0.6.4"
scraper = "0.29.0"
backtrace = "0.3.77"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

base64 = "0.23.1"

# Tauri / HTTP / Server
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-build = { version = "2.7.6", features = [] }
tauri-utils = { version = "2.10.4", features = ["schema"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
http = "1.5.0"
lazy_static = "1.5.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
timer = "0.2.0"
globset = "0.4.21"
fuzzy-matcher = "0.3.7"
tempfile = "3.27.0"
notify = "8.2.2"
inventory = "0.3.25"
dirs = "7"

zerolaunch-plugin-api = { path = "crates/plugin-api", version = "0.2.7" }
zerolaunch-plugin-host = { path = "crates/plugin-host", version = "0.2.4" }
zerolaunch-plugin-protocol = { path = "crates/plugin-protocol", version = "0.2.4" }
zerolaunch-plugin-sdk-rust = { path = "crates/plugin-sdk-rust", version = "0.2.4" }
zerolaunch-platform-windows = { path = "crates/platform-windows", version = "0.2.5" }

[profile.release]
codegen-units = 16
panic = "abort"
strip = true
