<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">ZeroLaunch-rs</title>
  <desc id="desc">ZeroLaunch-rs Windows launcher: type fast, mistype, still launches. The search panel correcting a transposed input like chorem to Chrome.</desc>

  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1D5"/>
      <stop offset="0.5" stop-color="#39C5BB"/>
      <stop offset="1" stop-color="#0E7C74"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#F3FAF9"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#D9ECE9" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#topGrad)"/>

  <g id="title-block" transform="translate(56 44)">
    <text x="0" y="4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" letter-spacing="3" fill="#0E7C74">WINDOWS LAUNCHER &#183; TAURI 2 + RUST + VUE</text>
    <text x="0" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="64" font-weight="800" fill="#0B1F1C">ZeroLaunch-rs</text>
    <text x="0" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#0B1F1C">Type fast. Mistype. Still launches.</text>
    <text x="0" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#4A625E">A Windows keyboard launcher that forgives typos.</text>
    <g id="keys" transform="translate(0 170)">
      <rect x="0" y="0" width="64" height="40" rx="8" fill="#FFFFFF" stroke="#C7DDD9" stroke-width="2"/>
      <text x="32" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#334845">Alt</text>
      <rect x="74" y="0" width="118" height="40" rx="8" fill="#FFFFFF" stroke="#C7DDD9" stroke-width="2"/>
      <text x="133" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#334845">Space</text>
      <rect x="202" y="0" width="96" height="40" rx="8" fill="#0E7C74"/>
      <text x="250" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#FFFFFF">Enter</text>
      <text x="312" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#566E6A">wake &#183; type &#183; go</text>
    </g>
    <text x="0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#566E6A">Runs locally — launch history and settings stay on your machine.</text>
  </g>

  <g id="project-proof" transform="translate(724 40)">
    <rect x="0" y="0" width="420" height="300" rx="16" fill="#FFFFFF" stroke="#CBE3DF" stroke-width="2"/>
    <rect x="24" y="20" width="240" height="26" rx="13" fill="#E3F5F2"/>
    <text x="36" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="1" fill="#0E7C74">STANDARD &#183; DEFAULT</text>
    <g id="input-row" transform="translate(24 56)">
      <rect x="0" y="0" width="372" height="56" rx="10" fill="#F3FAF9" stroke="#CBE3DF" stroke-width="2"/>
      <text x="16" y="37" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" fill="#0B1F1C">chorem</text>
      <rect x="132" y="14" width="3" height="28" fill="#0E7C74"/>
      <text x="356" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#5F7570">typo</text>
    </g>
    <g id="hit-row" transform="translate(24 124)">
      <rect x="0" y="0" width="372" height="52" rx="10" fill="#E6F6F3" stroke="#0E7C74" stroke-width="2"/>
      <rect x="0" y="10" width="5" height="32" fill="#0E7C74"/>
      <text x="20" y="33" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#0B1F1C">Chrome</text>
      <text x="352" y="32" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#0E7C74">App</text>
    </g>
    <g id="alt-row-1" transform="translate(24 184)">
      <rect x="0" y="0" width="372" height="44" rx="10" fill="#F7FBFA"/>
      <text x="20" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#5F7570">Chromium</text>
    </g>
    <g id="alt-row-2" transform="translate(24 232)">
      <rect x="0" y="0" width="372" height="44" rx="10" fill="#F7FBFA"/>
      <text x="20" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#5F7570">Snipaste</text>
    </g>
  </g>
</svg>
