<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">ZeroLaunch-rs</title>
  <desc id="desc">ZeroLaunch-rs Windows 啟動器：敲得快、敲錯了，照樣啟動。搜尋面板把錯位輸入 chorem 修正為 Chrome 的示意。</desc>

  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1D5"/>
      <stop offset="0.5" stop-color="#39C5BB"/>
      <stop offset="1" stop-color="#0E7C74"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0C1413"/>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#22332F" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#topGrad)"/>

  <g id="title-block" transform="translate(56 44)">
    <text x="0" y="4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" letter-spacing="3" fill="#5CE1D5">WINDOWS LAUNCHER &#183; TAURI 2 + RUST + VUE</text>
    <text x="0" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="64" font-weight="800" fill="#EDF5F2">ZeroLaunch-rs</text>
    <text x="0" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#EDF5F2">敲得快，敲錯了，照樣啟動。</text>
    <text x="0" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#9FB8B1">Type fast. Mistype. Still launches.</text>
    <g id="keys" transform="translate(0 170)">
      <rect x="0" y="0" width="64" height="40" rx="8" fill="#13211E" stroke="#2A423C" stroke-width="2"/>
      <text x="32" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#C9D9D4">Alt</text>
      <rect x="74" y="0" width="118" height="40" rx="8" fill="#13211E" stroke="#2A423C" stroke-width="2"/>
      <text x="133" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#C9D9D4">Space</text>
      <rect x="202" y="0" width="96" height="40" rx="8" fill="#0E7C74"/>
      <text x="250" y="26" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#FFFFFF">Enter</text>
      <text x="312" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#8AA5A0">wake &#183; type &#183; go</text>
    </g>
    <text x="0" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#8AA5A0">本機執行，啟動歷史與設定都留在本機</text>
  </g>

  <g id="project-proof" transform="translate(724 40)">
    <rect x="0" y="0" width="420" height="300" rx="16" fill="#13211E" stroke="#29423B" stroke-width="2"/>
    <rect x="24" y="20" width="240" height="26" rx="13" fill="#14332D"/>
    <text x="36" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="1" fill="#5CE1D5">STANDARD &#183; DEFAULT</text>
    <g id="input-row" transform="translate(24 56)">
      <rect x="0" y="0" width="372" height="56" rx="10" fill="#0C1413" stroke="#29423B" stroke-width="2"/>
      <text x="16" y="37" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" fill="#EDF5F2">chorem</text>
      <rect x="132" y="14" width="3" height="28" fill="#0E7C74"/>
      <text x="356" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#8AA5A0">typo</text>
    </g>
    <g id="hit-row" transform="translate(24 124)">
      <rect x="0" y="0" width="372" height="52" rx="10" fill="#14332D" stroke="#0E7C74" stroke-width="2"/>
      <rect x="0" y="10" width="5" height="32" fill="#0E7C74"/>
      <text x="20" y="33" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#EDF5F2">Chrome</text>
      <text x="352" y="32" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#5CE1D5">App</text>
    </g>
    <g id="alt-row-1" transform="translate(24 184)">
      <rect x="0" y="0" width="372" height="44" rx="10" fill="#0F1A18"/>
      <text x="20" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#8AA5A0">Chromium</text>
    </g>
    <g id="alt-row-2" transform="translate(24 232)">
      <rect x="0" y="0" width="372" height="44" rx="10" fill="#0F1A18"/>
      <text x="20" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#8AA5A0">Snipaste</text>
    </g>
  </g>
</svg>
