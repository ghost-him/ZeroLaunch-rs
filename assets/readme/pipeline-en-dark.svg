<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Matching pipeline: from keystroke to launch</title>
  <desc id="desc">Five stages: input, keyword split, candidate sources, scoring and ranking, execute action. Every stage is a replaceable plugin.</desc>

  <rect width="1200" height="740" rx="26" fill="#0C1413"/>
  <rect x="1" y="1" width="1198" height="738" rx="25" fill="none" stroke="#22332F" stroke-width="2"/>

  <g id="stage-1">
    <rect x="40" y="32" width="1120" height="116" rx="14" fill="#13211E" stroke="#29423B" stroke-width="2"/>
    <circle cx="104" cy="90" r="28" fill="#0E7C74"/>
    <text x="104" y="99" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#FFFFFF">1</text>
    <text x="156" y="82" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#EDF5F2">Input</text>
    <text x="156" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#8AA5A0">Press Alt + Space, then type (e.g. chorem)</text>
  </g>

  <path d="M96 153 L104 161 L112 153" fill="none" stroke="#5CE1D5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-2">
    <rect x="40" y="172" width="1120" height="116" rx="14" fill="#13211E" stroke="#29423B" stroke-width="2"/>
    <circle cx="104" cy="230" r="28" fill="#0E7C74"/>
    <text x="104" y="239" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#FFFFFF">2</text>
    <text x="156" y="222" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#EDF5F2">Keyword split</text>
    <text x="156" y="260" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#8AA5A0">Split into keyword groups: pinyin · initials · camelCase · spaces · symbols · aliases</text>
  </g>

  <path d="M96 293 L104 301 L112 293" fill="none" stroke="#5CE1D5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-3">
    <rect x="40" y="312" width="1120" height="116" rx="14" fill="#13211E" stroke="#29423B" stroke-width="2"/>
    <circle cx="104" cy="370" r="28" fill="#0E7C74"/>
    <text x="104" y="379" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#FFFFFF">3</text>
    <text x="156" y="362" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#EDF5F2">Candidate sources</text>
    <text x="156" y="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#8AA5A0">From 6 sources: apps · Start Menu · bookmarks · built-in commands · custom items · URLs</text>
  </g>

  <path d="M96 433 L104 441 L112 433" fill="none" stroke="#5CE1D5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-4">
    <rect x="40" y="452" width="1120" height="116" rx="14" fill="#13211E" stroke="#29423B" stroke-width="2"/>
    <circle cx="104" cy="510" r="28" fill="#0E7C74"/>
    <text x="104" y="519" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#FFFFFF">4</text>
    <text x="156" y="502" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#EDF5F2">Scoring &amp; ranking</text>
    <text x="156" y="540" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#8AA5A0">Three-way scoring (edit distance + BM25 + KMP), plus launch history and query affinity</text>
  </g>

  <path d="M96 573 L104 581 L112 573" fill="none" stroke="#5CE1D5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-5">
    <rect x="40" y="592" width="1120" height="116" rx="14" fill="#13211E" stroke="#29423B" stroke-width="2"/>
    <circle cx="104" cy="650" r="28" fill="#0E7C74"/>
    <text x="104" y="659" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#FFFFFF">5</text>
    <text x="156" y="642" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#EDF5F2">Execute action</text>
    <text x="156" y="680" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" fill="#8AA5A0">Executor: open app · run command · open file or folder · open URL · activate window</text>
  </g>
</svg>
