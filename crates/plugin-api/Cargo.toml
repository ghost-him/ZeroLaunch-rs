[package]
name = "zerolaunch-plugin-api"
version = "0.2.0"
edition.workspace = true
 license = "Apache-2.0"
description = "ZeroLaunch plugin SDK — traits, data types, host API surface."
repository.workspace = true

[features]
default = ["webdav"]
webdav = ["dep:reqwest_dav"]
mock = ["dep:mockall"]

[dependencies]
