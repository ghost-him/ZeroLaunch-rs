[package]
name = "zerolaunch-rs"
version.workspace = true
description = "🚀 Lightning-fast, accurate, lightweight & pure Windows application launcher!"
authors = ["ghost-him"]
edition = "2021"
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zerolaunch_rs_lib"
crate-type = ["rlib"]

[dependencies]
# Windows platform (features extend workspace base)
windows = { workspace = true, features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Management_Deployment",
    "Win32_System_Threading",
    "Foundation",
    "Win32_Security",
    "Foundation_Collections",
    "System",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Storage_Streams",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Networking",
    "Win32_Networking_WinInet",
    "Win32_System_LibraryLoader",
    "Win32_System_Environment",
] }

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true

# Logging & observability
tracing-subscriber.workspace = true
tracing-appender.workspace = true
inventory.workspace = true

# Standalone utility deps
lazy_static.workspace = true
timer.workspace = true
globset.workspace = true
fuzzy-matcher.workspace = true
tempfile.workspace = true
notify.workspace = true

# Workspace-managed common deps
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
widestring.workspace = true
windows-core.workspace = true
rayon.workspace = true
dashmap.workspace = true
image.workspace = true
tracing.workspace = true
chrono.workspace = true
parking_lot.workspace = true
backtrace.workspace = true
kmeans_colors.workspace = true
palette.workspace = true
anyhow.workspace = true
 async-openai.workspace = true
 async-trait.workspace = true
 futures-util.workspace = true
 lnk.workspace = true
 ollama-rs.workspace = true
 reqwest.workspace = true
 tokio.workspace = true
winreg.workspace = true
scraper.workspace = true
url.workspace = true
fnv.workspace = true
fontdb.workspace = true
resvg.workspace = true
usvg.workspace = true
tiny-skia.workspace = true
encoding_rs.workspace = true
ini.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio-util.workspace = true
walkdir.workspace = true
once_cell.workspace = true
 lru.workspace = true
 sha2.workspace = true
bincode-next.workspace = true
zip.workspace = true
whoami.workspace = true
blake3.workspace = true
uiautomation.workspace = true
toml.workspace = true
rand.workspace = true
regex.workspace = true
base64.workspace = true
time.workspace = true

# Internal crates
zerolaunch-plugin-api.workspace = true
zerolaunch-plugin-host.workspace = true
zerolaunch-plugin-protocol.workspace = true
zerolaunch-platform-windows.workspace = true

[features]
portable = ["zerolaunch-platform-windows/portable"]

[dev-dependencies]
# mock 特性提供插件 API 的桩实现，供内置组件全量注册测试构造测试用 HostApi。
zerolaunch-plugin-api = { workspace = true, features = ["mock"] }
tempfile.workspace = true
# 集成测试构造跨天日期（运行态桶对齐用例）
chrono.workspace = true

[lints.rust]
# MSVC 链接器把 "正在创建库 ... .lib 和对象 ... .exp" 这类正常提示写到 stdout，
# rustc 1.84+ 通过 linker_messages lint 上报；纯 Windows 链接期噪音，静默处理。
linker_messages = "allow"
