[package]
name = "zerolaunch-rs"
version = "1.3.1"
description = "🚀 Lightning-fast, accurate, lightweight & pure Windows application launcher!"
authors = ["ghost-him"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zerolaunch_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
zerolaunch-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
zerolaunch-platform-macos.workspace = true

[dependencies]

# Tauri (adds features on top of workspace base)
tauri = { workspace = true, features = ["image-ico", "image-png"] }

# Tauri plugins
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-shell.workspace = true
tauri-utils.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true

# Logging & observability
tracing-subscriber.workspace = true
tracing-appender.workspace = true
inventory.workspace = true

# Standalone utility deps
lazy_static.workspace = true
timer.workspace = true
globset.workspace = true
fuzzy-matcher.workspace = true
tempfile.workspace = true
notify.workspace = true

# Workspace-managed common deps
serde.workspace = true
serde_json.workspace = true
rdev.workspace = true
widestring.workspace = true
rayon.workspace = true
dashmap.workspace = true
image.workspace = true
tracing.workspace = true
chrono.workspace = true
parking_lot.workspace = true
backtrace.workspace = true
kmeans_colors.workspace = true
palette.workspace = true
anyhow.workspace = true
 async-openai.workspace = true
 async-trait.workspace = true
 futures-util.workspace = true
 ollama-rs.workspace = true
 reqwest.workspace = true
 reqwest_dav.workspace = true
 tokio.workspace = true
sys-locale.workspace = true
scraper.workspace = true
url.workspace = true
fnv.workspace = true
fontdb.workspace = true
resvg.workspace = true
usvg.workspace = true
tiny-skia.workspace = true
encoding_rs.workspace = true
ini.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio-util.workspace = true
walkdir.workspace = true
once_cell.workspace = true
 lru.workspace = true
 sha2.workspace = true
bincode-next.workspace = true
zip.workspace = true
whoami.workspace = true
blake3.workspace = true
toml.workspace = true
rand.workspace = true
regex.workspace = true
base64.workspace = true
time.workspace = true

# Internal crates
zerolaunch-plugin-api.workspace = true
zerolaunch-plugin-host.workspace = true
zerolaunch-plugin-protocol.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
portable = ["zerolaunch-platform-windows/portable"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true

[dev-dependencies]
# mock 特性提供插件 API 的桩实现，供内置组件全量注册测试构造测试用 HostApi。
zerolaunch-plugin-api = { workspace = true, features = ["mock"] }
tempfile.workspace = true

[lints.rust]
# MSVC 链接器把 "正在创建库 ... .lib 和对象 ... .exp" 这类正常提示写到 stdout，
# rustc 1.84+ 通过 linker_messages lint 上报；纯 Windows 链接期噪音，静默处理。
linker_messages = "allow"
