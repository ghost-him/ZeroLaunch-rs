<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>ZeroLaunch - Two-tone Flow Ring</title>
  <desc>ZeroLaunch app icon: a two-tone fluid ring (0 for Zero) formed by two interlocking gradient arcs, inspired by Flow Launcher's design language.</desc>
  <defs>
    <linearGradient id="lgL" x1="25" y1="75" x2="75" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1D5"/>
      <stop offset="0.5" stop-color="#39C5BB"/>
      <stop offset="1" stop-color="#22A89E"/>
    </linearGradient>
    <linearGradient id="lgD" x1="75" y1="75" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7C74"/>
      <stop offset="1" stop-color="#0A5A54"/>
    </linearGradient>
  </defs>
  <path d="M 64.78 78.38 A 32 32 0 0 1 30.74 24.44" fill="none" stroke="url(#lgL)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 35.22 21.62 A 32 32 0 0 1 69.48 75.39" fill="none" stroke="url(#lgD)" stroke-width="14" stroke-linecap="round"/>
</svg>
